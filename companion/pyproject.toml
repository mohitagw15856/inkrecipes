[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inkrecipes-companion"
version = "0.1.0"
description = "Converts recipes to .rcp for the InkRecipes reader"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
inkrecipes = "inkrecipes.cli:main"

[tool.setuptools.packages.find]
include = ["inkrecipes*"]
